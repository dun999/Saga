name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Fedora 43 image index (GCC 15, multi-arch). Pin the index, not one architecture's manifest.
    container: registry.fedoraproject.org/fedora@sha256:f26286dae657dfce0fefcdca33d759fa565dbe772ed9f78e5608f1961dafc8cb
    steps:
      - name: Install toolchain
        run: dnf -y install cmake ninja-build gcc-c++ libcurl-devel libsodium-devel zlib-devel git pkgconf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: ./build/saga help

  macos:
    runs-on: macos-latest
    steps:
      - name: Install toolchain
        run: brew install cmake ninja libsodium pkgconf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build -- -k 0
      - name: Smoke test
        run: |
          ./build/saga help
          ./build/saga serve --no-memory --port 8090 &
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8090/app && break; sleep 0.5; done
          curl -fsS -o /dev/null -w "app: %{http_code}\n" http://127.0.0.1:8090/app
