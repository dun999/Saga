name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Fedora 43 image index (GCC 15, multi-arch). Pin the index, not one architecture's manifest.
    container: registry.fedoraproject.org/fedora@sha256:f26286dae657dfce0fefcdca33d759fa565dbe772ed9f78e5608f1961dafc8cb
    steps:
      - name: Install toolchain
        run: dnf -y install cmake ninja-build gcc-c++ binutils libcurl-devel libsodium-devel zlib-devel git pkgconf python3
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --parallel 2
      - name: Shared memory regressions
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: python3 tests/local/smoke.py ./build/saga

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ binutils libcurl4-openssl-dev libsodium-dev zlib1g-dev git pkg-config python3
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --parallel 2
      - name: Shared memory regressions
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: python3 tests/local/smoke.py ./build/saga

  macos:
    runs-on: macos-latest
    steps:
      - name: Install toolchain
        run: brew install cmake ninja libsodium pkgconf python
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --parallel 2
      - name: Shared memory regressions
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: python3 tests/local/smoke.py ./build/saga
